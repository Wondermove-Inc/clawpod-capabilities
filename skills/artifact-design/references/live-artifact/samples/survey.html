<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="clawpod-live" content='{"v":1,"keys":[],"capabilities":["submit"]}'>
<title>선호도 설문</title>
<style>
:root{color-scheme:light dark;font-family:system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;padding:24px;max-width:560px;margin-inline:auto;line-height:1.6}h1{font-size:24px;margin:0 0 8px}p{color:light-dark(#555,#bbb)}fieldset{border:0;padding:0;margin:24px 0}legend{font-weight:600;margin-bottom:8px}label{display:block;padding:10px 0}input{margin-right:10px;accent-color:#6366f1}textarea{width:100%;padding:12px;border:1px solid #8888;border-radius:8px;font:inherit;background:transparent;color:inherit}button{border:0;border-radius:8px;background:#4f46e5;color:#fff;font:inherit;padding:12px 20px;width:100%;cursor:pointer}button:disabled{opacity:.55;cursor:wait}#status{min-height:26px;font-size:14px}
</style>
</head>
<body>
<h1>어떤 방식으로 일하고 싶으세요?</h1>
<p>답변을 선택하고 제출하면 이 대화의 에이전트가 확인합니다.</p>
<fieldset><legend>선호하는 업무 방식</legend>
<label><input type="radio" name="style" value="focused">집중해서 혼자 작업하기</label>
<label><input type="radio" name="style" value="collaborative">함께 의견을 나누며 작업하기</label>
</fieldset>
<fieldset><legend>중요하게 생각하는 것 (복수 선택)</legend>
<label><input type="checkbox" name="priorities" value="speed">빠른 진행</label>
<label><input type="checkbox" name="priorities" value="quality">꼼꼼한 완성도</label>
</fieldset>
<label for="note">추가로 알려주실 내용</label><textarea id="note" rows="3" maxlength="2000"></textarea>
<p id="status" role="status" aria-live="polite"></p>
<button id="submit" type="button">답변 제출</button>
<script>
var button=document.getElementById('submit'),statusEl=document.getElementById('status');
button.addEventListener('click',async function(){
  var selected=document.querySelector('input[name="style"]:checked');
  if(!selected){statusEl.textContent='선호하는 업무 방식을 선택해 주세요.';return;}
  var result={style:selected.value,priorities:Array.from(document.querySelectorAll('input[name="priorities"]:checked')).map(function(el){return el.value;}),note:document.getElementById('note').value};
  button.disabled=true;statusEl.textContent='제출 중…';
  try{await clawpod.submit(result);statusEl.textContent='제출했습니다. 대화에서 에이전트의 답변을 확인해 주세요.';button.textContent='다시 제출';}
  catch(error){statusEl.textContent=error.code==='rate_limited'?'잠시 후 다시 제출해 주세요.':'제출하지 못했습니다. 입력은 유지됩니다. 다시 시도해 주세요.';button.textContent='다시 시도';}
  finally{button.disabled=false;}
});
</script>
</body>
</html>
